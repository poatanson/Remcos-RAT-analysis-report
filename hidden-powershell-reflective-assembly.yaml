title: Hidden PowerShell Reflective .NET Assembly Loading from Base64
id: 5a6a8fd8-3e62-4d3d-9cc4-1e1f2dd8f802
status: experimental
description: >
  Detects PowerShell command lines that decode a Base64 payload and load it
  as a .NET assembly, combined with hidden window or execution policy bypass flags.
author: SOC
date: 2026-09-19
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1620/
  - https://attack.mitre.org/techniques/T1140/

logsource:
  product: windows
  category: process_creation

detection:
  selection_img:
    - Image|endswith:
        - '\powershell.exe'
        - '\pwsh.exe'
    - OriginalFileName:
        - 'PowerShell.EXE'
        - 'pwsh.dll'
  selection_decode:
    CommandLine|contains: 'FromBase64String'
  selection_load:
    CommandLine|contains:
      - 'Reflection.Assembly]::Load'
      - 'CurrentDomain.Load'
  selection_flags:
    CommandLine|contains:
      - '-ExecutionPolicy Bypass'
      - '-ExecutionPolicy Unrestricted'
      - '-exec Bypass'
      - '-ep Bypass'
      - '-ep Unrestricted'
      - '-WindowStyle Hidden'
      - '-window hidden'
      - '-win hidden'
      - '-w hidden'
  condition: selection_img and selection_decode and selection_load and selection_flags

fields:
  - Image
  - CommandLine
  - ParentImage
  - ParentCommandLine
  - User

falsepositives:
  - Authorized PowerShell-based software deployment
  - Enterprise endpoint management scripts (SCCM, Intune, etc.)
  - Security testing and malware analysis environments

level: high

tags:
  - attack.execution
  - attack.t1059.001
  - attack.defense-evasion
  - attack.t1027
  - attack.t1140
  - attack.t1620
